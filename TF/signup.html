<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | TaskFlow</title>
    <link href="./assets/src/output.css" rel="stylesheet" />
  </head>

  <body class="min-h-screen bg-[#F8F7F4] text-[#2F3033]">
    <!-- Navbar -->
    <header class="w-full">
      <nav
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-6 lg:px-8"
      >
        <!-- Logo -->
        <a href="./index.html" class="flex items-center gap-2">
          <img
            src="./assets/logos/logo-taskflow.png"
            alt="TaskFlow logo"
            class="h-12 w-12 object-contain"
          />

          <span class="text-2xl font-semibold tracking-tight"> TaskFlow </span>
        </a>

        <!-- Login -->
        <div class="text-sm">
          <span class="text-[#6B6B6B]"> Already have an account? </span>

          <a
            href="./login.html"
            class="ml-2 font-semibold text-[#2F3033] transition hover:text-[#B89B5E]"
          >
            Log In
          </a>
        </div>
      </nav>
    </header>

    <!-- Signup Section -->
    <main>
      <section
        class="mx-auto flex min-h-[calc(100vh-100px)] max-w-7xl items-center justify-center px-6 py-12 lg:px-8"
      >
        <!-- Signup Card -->
        <div class="w-full max-w-md">
          <!-- Heading -->
          <div class="mb-8 text-center">
            <p
              class="mb-4 text-xs font-semibold tracking-[0.3em] text-[#B89B5E]"
            >
              GET STARTED
            </p>

            <h1
              class="text-4xl font-bold tracking-tight text-[#2F3033] md:text-5xl"
            >
              Create your account
            </h1>

            <p class="mt-4 text-sm leading-6 text-[#6B6B6B]">
              Start organizing your tasks and focus on what matters.
            </p>
          </div>

          <!-- Signup Form -->
          <form class="space-y-5">
            <!-- Full Name -->
            <div>
              <label
                for="name"
                class="mb-2 block text-sm font-medium text-[#2F3033]"
              >
                Full name
              </label>

              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
                class="w-full border border-[#D8D5CF] bg-white px-4 py-3.5 text-sm text-[#2F3033] outline-none transition placeholder:text-[#A3A3A3] focus:border-[#B89B5E] focus:ring-1 focus:ring-[#B89B5E]"
              />
            </div>

            <!-- Email -->
            <div>
              <label
                for="email"
                class="mb-2 block text-sm font-medium text-[#2F3033]"
              >
                Email address
              </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
                class="w-full border border-[#D8D5CF] bg-white px-4 py-3.5 text-sm text-[#2F3033] outline-none transition placeholder:text-[#A3A3A3] focus:border-[#B89B5E] focus:ring-1 focus:ring-[#B89B5E]"
              />
            </div>

            <!-- Password -->
            <div>
              <label
                for="password"
                class="mb-2 block text-sm font-medium text-[#2F3033]"
              >
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
                class="w-full border border-[#D8D5CF] bg-white px-4 py-3.5 text-sm text-[#2F3033] outline-none transition placeholder:text-[#A3A3A3] focus:border-[#B89B5E] focus:ring-1 focus:ring-[#B89B5E]"
              />
            </div>

            <!-- Confirm Password -->
            <div>
              <label
                for="confirmPassword"
                class="mb-2 block text-sm font-medium text-[#2F3033]"
              >
                Confirm password
              </label>

              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                required
                class="w-full border border-[#D8D5CF] bg-white px-4 py-3.5 text-sm text-[#2F3033] outline-none transition placeholder:text-[#A3A3A3] focus:border-[#B89B5E] focus:ring-1 focus:ring-[#B89B5E]"
              />
            </div>
            <!-- Signup Button -->
            <button
              type="submit"
              class="w-full bg-[#2F3033] px-6 py-3.5 text-sm font-semibold text-white transition hover:bg-[#B89B5E]"
            >
              Create Account
            </button>
          </form>

          <!-- Login -->
          <p class="mt-8 text-center text-sm text-[#6B6B6B]">
            Already have an account?

            <a
              href="./login.html"
              class="font-semibold text-[#2F3033] transition hover:text-[#B89B5E]"
            >
              Log in
            </a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
