<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | TaskFlow</title>

    <link href="./assets/src/output.css" rel="stylesheet" />
  </head>

  <body class="min-h-screen bg-[#F8F7F4] text-[#2F3033]">
    <!-- Navbar -->
    <header class="w-full">
      <nav class="mx-auto flex max-w-7xl px-6 py-6 lg:px-8">
        <a href="./index.html" class="flex items-center gap-2">
          <img
            src="./assets/logos/logo-taskflow.png"
            alt="TaskFlow logo"
            class="h-12 w-12 object-contain"
          />

          <span class="text-2xl font-semibold tracking-tight"> TaskFlow </span>
        </a>
      </nav>
    </header>

    <!-- Reset Password Section -->
    <main>
      <section
        class="mx-auto flex min-h-[calc(100vh-100px)] max-w-7xl items-center justify-center px-6 py-12 lg:px-8"
      >
        <div class="w-full max-w-md">
          <!-- Heading -->
          <div class="mb-8 text-center">
            <div
              class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-[#B89B5E]/10"
            >
              <i data-lucide="lock-keyhole" class="h-7 w-7 text-[#B89B5E]"></i>
            </div>

            <p
              class="mb-4 text-xs font-semibold tracking-[0.3em] text-[#B89B5E]"
            >
              ACCOUNT RECOVERY
            </p>

            <h1
              class="text-4xl font-bold tracking-tight text-[#2F3033] md:text-5xl"
            >
              Reset password
            </h1>

            <p class="mt-4 text-sm leading-6 text-[#6B6B6B]">
              Choose a new password for your TaskFlow account.
            </p>
          </div>

          <!-- Reset Form -->
          <form id="resetPasswordForm" class="space-y-5" novalidate>
            <!-- New Password -->
            <div>
              <label
                for="newPassword"
                class="mb-2 block text-sm font-medium text-[#2F3033]"
              >
                New password
              </label>

              <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Enter your new password"
                autocomplete="new-password"
                required
                minlength="8"
                class="w-full border border-[#D8D5CF] bg-white px-4 py-3.5 text-sm text-[#2F3033] outline-none transition placeholder:text-[#A3A3A3] focus:border-[#B89B5E] focus:ring-1 focus:ring-[#B89B5E]"
              />

              <p class="mt-2 text-xs text-[#6B6B6B]">
                Use at least 8 characters.
              </p>
            </div>

            <!-- Confirm Password -->
            <div>
              <label
                for="confirmPassword"
                class="mb-2 block text-sm font-medium text-[#2F3033]"
              >
                Confirm new password
              </label>

              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter your new password"
                autocomplete="new-password"
                required
                minlength="8"
                class="w-full border border-[#D8D5CF] bg-white px-4 py-3.5 text-sm text-[#2F3033] outline-none transition placeholder:text-[#A3A3A3] focus:border-[#B89B5E] focus:ring-1 focus:ring-[#B89B5E]"
              />
            </div>

            <!-- Feedback Message -->
            <div
              id="resetMessage"
              class="hidden border px-4 py-3 text-sm"
              role="alert"
              aria-live="polite"
            ></div>

            <!-- Submit -->
            <button
              type="submit"
              class="w-full bg-[#2F3033] px-6 py-3.5 text-sm font-semibold text-white transition hover:bg-[#B89B5E]"
            >
              Reset password
            </button>
          </form>

          <!-- Back to Login -->
          <p class="mt-8 text-center text-sm text-[#6B6B6B]">
            Remember your password?

            <a
              href="./login.html"
              class="font-semibold text-[#2F3033] transition hover:text-[#B89B5E]"
            >
              Back to login
            </a>
          </p>
        </div>
      </section>
    </main>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./assets/js/storage.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/reset-password.js"></script>
  </body>
</html>
